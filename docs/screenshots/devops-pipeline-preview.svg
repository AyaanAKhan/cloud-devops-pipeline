  <text x="190" y="500" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="20">$ docker build -t cloud-devops-pipeline .</text>
  <text x="190" y="535" fill="#60a5fa" font-family="JetBrains Mono, monospace" font-size="20">$ docker run -p 8080:8080 cloud-devops-pipeline</text>
